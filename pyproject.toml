[project]
name = "comfyui-auto-node-disable"
description = "Auto-disable ComfyUI custom_node packages that haven't been used in the last N workflow submissions."
version = "0.1.0"
license = { text = "MIT" }
authors = [
    { name = "zhitao" },
]
requires-python = ">=3.9"

[tool.comfy]
# 告诉 ComfyUI 加载这个扩展时不依赖 pydantic-settings。
# 把它标为 extension 后 ComfyUI 会调用 __init__.py 并自动加载 web/ 下的 JS。
PublisherId = "zhitao"
DisplayName = "ComfyUI Auto Node Disable"
Icon = ""

[tool.pytest.ini_options]
# 让 `pytest` 不带参数即可定位到 tests/ 目录，并只收集以 test_ 开头的文件。
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"